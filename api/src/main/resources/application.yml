spring:
  application:
    name: woertersee-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/woertersee}
    username: ${DATABASE_USER:woertersee}
    password: ${DATABASE_PASSWORD:local-only}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/woertersee}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/woertersee/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful
springdoc:
  paths-to-match: /api/v1/**
  swagger-ui:
    display-request-duration: true
    operations-sorter: method
woertersee:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    topic: ${OUTBOX_TOPIC:woertersee.domain-events.v1}
    poll-interval: ${OUTBOX_POLL_INTERVAL:1000}
  reminders:
    enabled: ${PRACTICE_REMINDERS_ENABLED:true}
    poll-interval: ${PRACTICE_REMINDERS_POLL_INTERVAL:60000}
  seed:
    legacy: ${LEGACY_SEED_ENABLED:false}
