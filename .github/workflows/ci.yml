name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: ./gradlew test
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime
          AUTH_KEYCLOAK_ID: woertersee-web
          AUTH_KEYCLOAK_SECRET: ci-build-only
          AUTH_KEYCLOAK_ISSUER: http://localhost:8081/realms/woertersee
